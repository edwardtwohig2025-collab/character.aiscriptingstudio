<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character.AI Advanced Scripting Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        header span {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-color);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .panel-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .panel-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .panel-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"], textarea, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-main);
            padding: 0.65rem 0.85rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .output-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            overflow-y: auto;
            color: #38bdf8;
            min-height: 350px;
        }

        .char-counter {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: -0.5rem;
        }

        .char-counter.warning span {
            color: #f59e0b;
        }

        .char-counter.danger span {
            color: var(--danger);
        }

        .actions-bar {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .helper-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>Character.AI Scripting Studio</h1>
        <span>Advanced Definition Builder (32k Spec)</span>
    </header>

    <div class="main-container">
        <!-- Input Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>Character Parameters</h2>
                <button class="btn btn-secondary" onclick="loadTemplate()">Load Example</button>
            </div>
            <div class="panel-body">
                <div class="row-group">
                    <div class="form-group">
                        <label for="charName">Character Name</label>
                        <input type="text" id="charName" placeholder="e.g. Professor Kaelen" oninput="generateScript()">
                    </div>
                    <div class="form-group">
                        <label for="userPlaceholder">User Placeholder</label>
                        <input type="text" id="userPlaceholder" value="{{user}}" oninput="generateScript()">
                    </div>
                </div>

                <div class="form-group">
                    <label for="charIdentity">Core Identity & Background (Context)</label>
                    <textarea id="charIdentity" placeholder="Define who {{char}} is at the core. Role, history, world rules..." oninput="generateScript()"></textarea>
                </div>

                <div class="form-group">
                    <label for="charPersonality">Personality & Behavioral Traits (Attitude)</label>
                    <textarea id="charPersonality" placeholder="Traits, emotional triggers, flaws, quirks, and communication style..." oninput="generateScript()"></textarea>
                </div>

                <div class="form-group">
                    <label for="charRules">Hard Constraints & Rules</label>
                    <textarea id="charRules" placeholder="Things {{char}} never does, boundaries, format limitations..." oninput="generateScript()"></textarea>
                </div>

                <div class="form-group">
                    <label for="charExamples">Example Dialogues (Syntax Blocks)</label>
                    <div class="helper-chips">
                        <div class="chip" onclick="insertExampleSnippet()">+ Insert Dialogue Block</div>
                    </div>
                    <textarea id="charExamples" placeholder="<START>&#10;{{user}}: Hello!&#10;{{char}}: Greetings, traveler." oninput="generateScript()"></textarea>
                </div>
            </div>
        </div>

        <!-- Output & Export Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>Compiled Advanced Definition</h2>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-secondary" onclick="clearAll()">Reset</button>
                    <button class="btn" onclick="copyToClipboard()">Copy Code</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                    <label>Live Output Code (Ready to paste into C.AI Advanced Definition)</label>
                    <div id="outputCode" class="output-box"></div>
                </div>
                <div class="char-counter" id="counterBox">
                    <span>Character Count: <strong id="charCount">0</strong> / 32,000 max</span>
                    <span id="weightNotice" style="color: var(--success);">Optimal Range (&lt; 3,000 recommended for primary weights)</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function generateScript() {
            const name = document.getElementById('charName').value.trim() || '{{char}}';
            const identity = document.getElementById('charIdentity').value.trim();
            const personality = document.getElementById('charPersonality').value.trim();
            const rules = document.getElementById('charRules').value.trim();
            const examples = document.getElementById('charExamples').value.trim();

            let compiled = "";

            if (identity) {
                compiled += `[Identity & Context]\n${identity}\n\n`;
            }
            if (personality) {
                compiled += `[Personality & Traits]\n${personality}\n\n`;
            }
            if (rules) {
                compiled += `[Behavioral Rules]\n${rules}\n\n`;
            }
            if (examples) {
                compiled += `[Example Dialogues]\n${examples}`;
            }

            // Replace generic structural tokens if user customized tag
            const outputDiv = document.getElementById('outputCode');
            outputDiv.textContent = compiled.trim();

            // Character count & validation logic
            const length = outputDiv.textContent.length;
            document.getElementById('charCount').textContent = length;
            
            const counterBox = document.getElementById('counterBox');
            const weightNotice = document.getElementById('weightNotice');

            if (length > 32000) {
                counterBox.className = "char-counter danger";
                weightNotice.textContent = "Exceeds Character.AI 32k limit!";
            } else if (length > 4000) {
                counterBox.className = "char-counter warning";
                weightNotice.textContent = "Safe, but core weights reside in the first ~3,000 characters.";
            } else {
                counterBox.className = "char-counter";
                weightNotice.textContent = "Optimal Range (Strong algorithmic focus).";
            }
        }

        function insertExampleSnippet() {
            const textarea = document.getElementById('charExamples');
            const snippet = `\n<START>\n{{user}}: "..."\n{{char}}: "..."`;
            textarea.value += snippet;
            generateScript();
        }

        function loadTemplate() {
            document.getElementById('charName').value = "Aelion the Cartographer";
            document.getElementById('charIdentity').value = "{{char}} is a cynical, exhausted mapmaker living in a floating steampunk metropolis. {{char}} values precision over politeness.";
            document.getElementById('charPersonality').value = "- Traits: Observant, dryly sarcastic, world-weary, intellectually sharp.\n- Quirks: Constantly cleans ink-stained fingers with a rag; mutters coordinates under breath.";
            document.getElementById('charRules').value = "- Never break character or acknowledge being an AI.\n- Keep responses concise (under 3 sentences usually).\n- Avoid modern slang.";
            document.getElementById('charExamples').value = "<START>\n{{user}}: Can you map the lower slums?\n{{char}}: *Sighs, wiping black ink off his thumb onto his apron.* The lower slums shift coordinates every tide cycle. You want to survive down there or just get lost faster?";
            generateScript();
        }

        function clearAll() {
            document.getElementById('charName').value = '';
            document.getElementById('charIdentity').value = '';
            document.getElementById('charPersonality').value = '';
            document.getElementById('charRules').value = '';
            document.getElementById('charExamples').value = '';
            generateScript();
        }

        function copyToClipboard() {
            const text = document.getElementById('outputCode').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Advanced definition code copied to clipboard!');
            });
        }

        // Initialize empty state
        generateScript();
    </script>
</body>
</html>
